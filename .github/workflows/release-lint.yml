name: release-lint

# Manual only: this demo app contains deliberate release mistakes, so the scan fails on purpose.
on: workflow_dispatch

permissions:
  contents: read
  security-events: write # upload the SARIF report to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Lint the release build
        uses: harpreetkbadhan/release-lint@v0
        with:
          file: android/app/build/outputs/bundle/release/app-release.aab
          sarif: release-lint.sarif
      - name: Upload findings to GitHub code scanning
        if: always() # also when release-lint failed the step
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: release-lint.sarif
